<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Slashosaurus">
  <defs>
    <linearGradient id="sl-tile" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#e8890c"/>
    </linearGradient>
    <linearGradient id="sl-sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#sl-tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#sl-sheen)"/>

  <ellipse cx="226" cy="408" rx="132" ry="18" fill="#000000" opacity="0.13"/>

  <!-- minimal geometric raptor (white), looking up at the slash -->
  <g fill="#ffffff">
    <!-- tail -->
    <path d="M136 332 L74 308 L100 350 Z"/>
    <!-- body capsule -->
    <rect x="120" y="296" width="188" height="84" rx="42"/>
    <!-- neck -->
    <rect x="272" y="252" width="60" height="92" rx="30"/>
    <!-- head, tilted up toward the slash -->
    <g transform="rotate(-18 302 246)">
      <rect x="264" y="216" width="104" height="56" rx="28"/>
    </g>
    <!-- eye (tile color punch-out) -->
    <circle cx="316" cy="234" r="9" fill="#e8890c"/>
    <!-- legs -->
    <rect x="158" y="364" width="38" height="56" rx="19"/>
    <rect x="248" y="364" width="38" height="56" rx="19"/>
    <!-- back bumps -->
    <circle cx="182" cy="292" r="12"/>
    <circle cx="222" cy="286" r="12"/>
    <circle cx="262" cy="290" r="12"/>
  </g>

  <!-- the slash: a bold rounded "/" the raptor just drew -->
  <rect x="368" y="96" width="52" height="232" rx="26" fill="#ffffff"
        transform="rotate(24 394 212)"/>

  <!-- spark left behind by the stroke -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M348 108 L356 88 L364 108 L384 116 L364 124 L356 144 L348 124 L328 116 Z"/>
  </g>
</svg>
